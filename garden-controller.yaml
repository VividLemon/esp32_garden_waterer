# ESPHome version of the ESP32 garden controller.
#
# Hardware:
#   Bed 1: valve GPIO23, moisture sensor GPIO36
#   Bed 2: valve GPIO22, moisture sensor GPIO34
#   Bed 3: valve GPIO21, moisture sensor GPIO35
#   Bed 4: valve GPIO19, moisture sensor GPIO32
#   Valve relays are active-LOW. Sensors are on ADC1 (safe to use with Wi-Fi).
#
# Each bed is stamped out from garden-bed.yaml. To add a bed, add another
# package entry.
#
# Talks to Home Assistant over ESPHome's native API.

substitutions:
  name: garden-controller
  friendly_name: Garden Controller
  # Failsafe: any valve left on longer than this shuts itself off, even if
  # Home Assistant or Wi-Fi is down. Set it longer than your longest watering run.
  max_valve_run: 30min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # "arduino" also works

logger:

api:
  encryption:
    key: !secret garden_controller__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi is unreachable, the device starts its own hotspot so you can fix it
  ap:
    ssid: ${friendly_name} Fallback Hotspot

captive_portal:

packages:
  bed1: !include
    file: garden-bed.yaml
    vars: { bed: "1", valve_pin: GPIO23, sensor_pin: GPIO36 }
  bed2: !include
    file: garden-bed.yaml
    vars: { bed: "2", valve_pin: GPIO22, sensor_pin: GPIO34 }
  bed3: !include
    file: garden-bed.yaml
    vars: { bed: "3", valve_pin: GPIO21, sensor_pin: GPIO35 }
  bed4: !include
    file: garden-bed.yaml
    vars: { bed: "4", valve_pin: GPIO19, sensor_pin: GPIO32 }
