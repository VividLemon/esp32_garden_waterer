# ESPHome port of the ESP32 garden controller.
#
# Hardware (same as the Arduino sketch):
#   Bed 1: valve GPIO23, moisture sensor GPIO36
#   Bed 2: valve GPIO22, moisture sensor GPIO34
#   Bed 3: valve GPIO21, moisture sensor GPIO35
#   Bed 4: valve GPIO19, moisture sensor GPIO32
#   Valve relays are active-LOW. Sensors are on ADC1 (safe to use with Wi-Fi).
#
# Each bed is stamped out from garden-bed.yaml, the same idea as the
# Bed beds[] array in the sketch. To add a bed, add another package entry.

substitutions:
  name: garden-controller
  friendly_name: Garden Controller
  # Failsafe (not in the original sketch): any valve left on longer than
  # this shuts itself off, even if Home Assistant or Wi-Fi is down.
  # Set it longer than your longest watering run.
  max_valve_run: 30min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # "arduino" also works

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Garden Controller Fallback"
    password: !secret fallback_ap_password

captive_portal:

packages:
  bed1: !include
    file: garden-bed.yaml
    vars: { bed: "1", valve_pin: GPIO23, sensor_pin: GPIO36 }
  bed2: !include
    file: garden-bed.yaml
    vars: { bed: "2", valve_pin: GPIO22, sensor_pin: GPIO34 }
  bed3: !include
    file: garden-bed.yaml
    vars: { bed: "3", valve_pin: GPIO21, sensor_pin: GPIO35 }
  bed4: !include
    file: garden-bed.yaml
    vars: { bed: "4", valve_pin: GPIO19, sensor_pin: GPIO32 }

# --- Optional: keep MQTT instead of (or alongside) the native API -----------
# ESPHome then handles HA discovery and online/offline status itself.
# Topics follow ESPHome's layout (<topic_prefix>/switch/..., /sensor/...),
# not garden/bed/N/valve/set, so update anything else that used the old ones.
#
# mqtt:
#   broker: !secret mqtt_broker
#   port: 1883
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   topic_prefix: garden-controller
#   discovery: true
